<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Diet Planner – BMI & Ayurveda Based</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Noto Serif', serif;
  background: url('https://www.toptal.com/designers/subtlepatterns/patterns/wood_pattern.png');
  background-size: cover;
  color: #3b2f2f;
}

h1 {
  text-align: center;
  padding: 25px;
  font-family: 'Marcellus', serif;
  color: #5a3a1e;
  background: linear-gradient(180deg, #fbeec1 0%, #f8e3a3 100%);
  border-bottom: 3px solid #c19a6b;
  box-shadow: 0 3px 10px rgba(0,0,0,0.2);
}

.container {
  max-width: 600px;
  margin: 40px auto;
  padding: 25px;
  background: rgba(255,255,255,0.9);
  border-radius: 12px;
  box-shadow: 0 0 25px rgba(120, 70, 20, 0.3);
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 6px;
  border: 1px solid #c19a6b;
  background: #fffdf8;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  background: linear-gradient(90deg, #d99b4a, #b67a2e);
  color: #fffaf0;
  font-weight: 600;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(184, 120, 20, 0.6);
}

#resultBox {
  margin-top: 30px;
  padding: 20px;
  background: #fff5db;
  border: 2px solid #cfa86e;
  border-radius: 12px;
  display: none;
  animation: fadeIn 0.6s ease-in-out;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(30px);}
  to {opacity: 1; transform: translateY(0);}
}

footer {
  text-align: center;
  margin-top: 30px;
  color: #7a5a2f;
  font-size: 14px;
}
</style>
</head>
<body>

<h1>🍎 Daily Diet Planner – BMI & Ayurveda Based</h1>

<div class="container">
  <label for="height">Enter Height (in cm):</label>
  <input type="number" id="height" placeholder="e.g., 170">

  <label for="weight">Enter Weight (in kg):</label>
  <input type="number" id="weight" placeholder="e.g., 65">

  <label for="diet">Select Food Preference:</label>
  <select id="diet">
    <option value="veg">Vegetarian</option>
    <option value="nonveg">Non-Vegetarian</option>
    <option value="mixed">Mixed</option>
  </select>

  <button onclick="calculateBMI()">🔍 Generate My Diet Plan</button>

  <div id="resultBox"></div>
</div>

<footer>Developed for IHWP Project Submission | Ayurveda & Wellness Theme</footer>

<script>
function calculateBMI() {
  const h = parseFloat(document.getElementById('height').value);
  const w = parseFloat(document.getElementById('weight').value);
  const pref = document.getElementById('diet').value;
  const box = document.getElementById('resultBox');

  if (!h || !w) {
    alert("⚠️ Please enter both height and weight!");
    return;
  }

  const bmi = (w / ((h/100) ** 2)).toFixed(1);
  let category = "";
  let advice = "";

  if (bmi < 18.5) category = "Underweight";
  else if (bmi < 24.9) category = "Normal Weight";
  else if (bmi < 29.9) category = "Overweight";
  else category = "Obese";

  // Diet suggestions based on BMI and preference
  const dietPlans = {
    veg: {
      Underweight: "Include ghee, milk, nuts, banana shakes, paneer, and lentils. Eat 5–6 small meals a day.",
      "Normal Weight": "Eat balanced meals with vegetables, chapati, dal, rice, and fruits. Stay hydrated.",
      Overweight: "Avoid fried food, sweets, and late-night snacks. Eat more green leafy veggies.",
      Obese: "Focus on salads, soups, and steamed foods. Avoid sugar and excess carbs."
    },
    nonveg: {
      Underweight: "Add eggs, chicken, milk, rice, and peanut butter to your meals.",
      "Normal Weight": "Eat balanced meals with chicken/fish, rice, vegetables, and fruits.",
      Overweight: "Choose grilled or boiled meat, avoid red meat, reduce oil intake.",
      Obese: "Eat boiled eggs, soups, fruits, and avoid heavy meats or fried food."
    },
    mixed: {
      Underweight: "Combine dairy, nuts, and lean meats. Include protein-rich foods.",
      "Normal Weight": "Eat balanced meals with a mix of plant and animal protein.",
      Overweight: "Limit sweets, fried items, and processed foods.",
      Obese: "Focus on fruits, boiled vegetables, and lean proteins with less oil."
    }
  };

  advice = dietPlans[pref][category];

  box.innerHTML = `
    <h2>Your BMI: <span style="color:#b77a30;">${bmi}</span></h2>
    <p><b>Category:</b> ${category}</p>
    <hr>
    <h3>🍽 Recommended Diet Plan:</h3>
    <p>${advice}</p>
  `;
  box.style.display = "block";
}
</script>

</body>
</html>
